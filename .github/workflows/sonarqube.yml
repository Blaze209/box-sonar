# SonarQube Cloud (SonarCloud) CI-based analysis via GitHub Actions.
# Generic scanner for source-only analysis (no compilation needed for decompiled code).
# Prerequisite: repo secrets SONAR_TOKEN and SONAR_HOST_URL=https://sonarcloud.io
name: "SonarQube"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    env:
      SONAR_SCANNER_OPTS: "-Xmx5120m -Xms1024m"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}