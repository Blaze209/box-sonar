# SonarQube Cloud (SonarCloud) CI-based analysis via GitHub Actions.
# Uses Maven scanner (sonar-maven-plugin) which is more efficient for Maven projects.
# Prerequisite: repository secrets SONAR_TOKEN (SonarCloud) and SONAR_HOST_URL=https://sonarcloud.io
name: "SonarQube"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: "-Xmx6144m -Xms2048m"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: SonarQube Scan (Maven)
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=blaze209_b1test -Dsonar.organization=blaze209 -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}