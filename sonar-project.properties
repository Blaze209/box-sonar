# SonarQube Cloud / SonarCloud analysis configuration
# Because these decompiled projects are large (>10MB of Java), we use CI-based
# analysis (SonarScanner via GitHub Actions) rather than automatic analysis.

sonar.projectKey=b1test
sonar.organization=YOUR_SONAR_ORG
sonar.host.url=https://sonarcloud.io

# Java sources live in the standard Maven location.
sonar.sources=src/main/java

# Decompiled code has no compiled classes/bytecode available and references
# external libraries, so tell the Java analyzer to work from source only.
sonar.java.binaries=
